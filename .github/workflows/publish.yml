name: Publish

on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "37 15 * * *"
    - cron: "17 18 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar qué se publicaría"
        type: boolean
        default: false
      days:
        description: "Ventana de Shorts a enlazar en días (entero mayor que 0; amplíala para recuperar pendientes)"
        type: string
        default: "7"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt playwright==1.63.0

      - uses: actions/cache/restore@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          path: .studio/state.enc
          key: studio-state-${{ github.run_id }}
          restore-keys: studio-state-

      - name: Load YouTube Studio session
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          STUDIO_STATE: ${{ secrets.STUDIO_STATE }}
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
        run: |
          mkdir -p .studio
          if [ -f .studio/state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in .studio/state.enc -out .studio/state.json -pass env:STUDIO_STATE_KEY
          else
            printf '%s' "$STUDIO_STATE" | base64 -d | gunzip > .studio/state.json
          fi

      - name: Link Shorts to their episode (related video)
        id: related
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        env:
          RELATED_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '7' }}
        run: python scripts/link_related_videos.py --state .studio/state.json --days "$RELATED_DAYS"

      - name: Warn if Shorts could not be linked
        if: steps.related.outcome == 'failure'
        run: echo "::warning::Fallaron enlaces de Shorts; revisa el log y completa manualmente cualquier verificación de identidad en Studio. Se intentará la publicación legacy, pero el job terminará en fallo."

      - name: Save YouTube Studio session
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          STUDIO_STATE_KEY: ${{ secrets.STUDIO_STATE_KEY }}
        run: |
          [ -f .studio/state.json ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -in .studio/state.json -out .studio/state.enc -pass env:STUDIO_STATE_KEY
          rm -f .studio/state.json

      - uses: actions/cache/save@v4
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          path: .studio/state.enc
          key: studio-state-${{ github.run_id }}

      - name: Make due unlisted videos public
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python publish.py $DRY_RUN

      - name: Fail if related video linking failed
        if: ${{ always() && steps.related.outcome == 'failure' }}
        run: |
          echo "::error::No se confirmaron todos los enlaces de Shorts. Revisa el paso de enlaces; si Studio pide verificar tu identidad, complétalo manualmente y reintenta con una ventana days suficiente."
          exit 1
