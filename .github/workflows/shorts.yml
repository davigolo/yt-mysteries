name: Shorts

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Subir a YouTube (false = solo generar el Short como artefacto)"
        type: boolean
        default: true
      episode:
        description: "video_id del episodio a promocionar (vacío = automático)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Generate and upload short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          UPLOAD_FLAG: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && '--no-upload' || '' }}
          EPISODE: ${{ inputs.episode }}
        run: python short.py $UPLOAD_FLAG ${EPISODE:+--episode "$EPISODE"}

      - name: Save history
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add shorts_history.json
          git commit -m "chore: add short $(date +%F-%H%M)" || { echo "Nothing to commit"; exit 0; }
          git pull --rebase -q && git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short
          path: |
            build/short.mp4
            build/short_script.json
            build/short_description.txt
            build/short_thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
