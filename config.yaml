channel:
  niche: "unsolved historical mysteries, strange disappearances and cold cases"
  language: "English"
  audience: "adults in the US, UK and Canada who enjoy documentary storytelling"
  tone: "calm, intriguing documentary narrator; respectful to victims; never graphic or gory"

script:
  models:
    - "gemini-3.8-flash"
    - "gemini-3.5-flash"
    - "gemini-flash-latest"
  target_words: 1900
  chapters: 6

voice:
  voice_id: "JBFqnCBsd6RMkjVDRZzb"
  model_id: "eleven_flash_v2_5"
  credits_per_char: 0.5
  stability: 0.45
  similarity_boost: 0.8
  style: 0.15
  scene_pause: 0.35
  chapter_pause: 1.2
  title_pause: 3.5

visuals:
  ai_model: "flux-2-turbo"
  ai_width: 2048
  ai_height: 1152
  ai_style: "people only from behind, in silhouette or out of focus with no clear faces, cinematic documentary still, moody low-key lighting, muted desaturated colors, subtle film grain, 35mm, realistic, no text, no watermark"
  max_ai_images: 40
  upscale_archive_below: 0
  max_upscales: 0

video:
  width: 1920
  height: 1080
  fps: 25
  zoom: 0.10
  burn_subtitles: true

thumbnail:
  model: "mystic"
  style: "dramatic cinematic thumbnail background, high contrast, dark moody atmosphere, single clear focal subject on the right, empty dark space on the left for text, no text"

music:
  volume: 0.07

upload:
  privacy: "unlisted"
  category_id: "27"
  contains_synthetic_media: true
  hashtags: "#mystery #history #unsolved"
  max_hashtags: 5

publish:
  after_hours: 22

playlists:
  episodes:
    all:
      title: "Unsolved Archives: Full Investigations"
      description: "Every full-length investigation from the channel: unsolved disappearances, historical enigmas and cold cases, told as calm, well-sourced documentaries."
    disappearance:
      title: "Unsolved Disappearances"
      description: "People, ships and aircraft that vanished without a trace, and every theory investigators have tested since."
    enigma:
      title: "Historical Enigmas"
      description: "Objects, documents, codes and places from history that still have no accepted explanation."
    solved:
      title: "Cold Cases Finally Solved"
      description: "Mysteries that stayed open for decades until new evidence finally revealed what happened."
    lost:
      title: "Lost Expeditions, Cities and Treasures"
      description: "Lost expeditions, vanished cities and missing treasures, and the searches that are still going on."
    phenomenon:
      title: "Strange Historical Phenomena"
      description: "Strange documented events and mass phenomena from history, and the theories that try to explain them."
  shorts:
    title: "Mystery Shorts"
    description: "Short teasers from our full investigations. Each one links to the complete documentary."

shorts:
  episode_window: 5
  min_words: 100
  max_words: 120
  min_beats: 14
  max_beats: 20
  reserve_credits: 20000
  music_volume: 0.16
  drone_volume: 0.22
  hashtags: "#mystery #unsolved #history #truecrime #shorts"
